file_uploads = On
upload_max_filesize = 64M
post_max_size = 80M
memory_limit = 256M
max_execution_time = 120
max_input_vars = 4000

; OPcache tuning (WP+WooCommerce+Dokan+RankMath > 4000 failu -> vengiam bytecode eviction/recompile)
opcache.max_accelerated_files = 10000
opcache.interned_strings_buffer = 16
opcache.memory_consumption = 192

; Daiktuva security: neskelbti PHP versijos
expose_php = Off
